<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book List</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f8f9fa;
        margin: 0;
        padding: 0;
    }

    h1 {
        text-align: center;
        padding: 20px;
        color: #4CAF50;
    }

    .book-list-container {
        display: flex;
        flex-direction: column; /* Stack each book info in a vertical line */
        gap: 20px;
        padding: 20px;
    }

    .book-card {
        display: flex;
        flex-direction: row; /* Align book content horizontally */
        background-color: white;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        height: 250px;
        padding: 10px;
        border: 2px solid #ddd; /* Added border */
        transition: transform 0.3s ease;
    }

    .book-card:hover {
        transform: translateY(-10px);
    }

    .book-image {
        width: 40%; /* 40% for the image */
        height: 100%;
        object-fit: cover;
        border-radius: 8px;
    }

    .book-info {
        width: 40%; /* 40% for the title, description, and author */
        padding: 10px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .book-info h3 {
        margin: 5px 0;
        font-size: 18px;
        color: #333;
    }

    .book-info p {
        font-size: 14px;
        color: #777;
        margin: 5px 0;
        height: 60px; /* Limit height for description */
        overflow: hidden;
    }

    .book-actions {
        width: 10%; /* 10% for the "View Details" button */
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    .book-actions a {
        background-color: #4CAF50;
        color: white;
        padding: 10px 15px;
        text-decoration: none;
        border-radius: 4px;
        width: 100%;
        text-align: center;
        transition: background-color 0.3s;
    }

    .book-actions a:hover {
        background-color: #45a049;
    }

    .create-book {
        text-align: center;
        margin-top: 20px;
    }

    .create-book a {
        background-color: #007BFF;
        color: white;
        padding: 10px 20px;
        text-decoration: none;
        border-radius: 4px;
    }

    .create-book a:hover {
        background-color: #0056b3;
    }
</style>

</head>
<body>

<h1>Book List</h1>

<div class="book-list-container">
    {% for book in books %}
        <div class="book-card">
            <img src="{{ book.pic.url }}" alt="{{ book.title }}" class="book-image"> <!-- Display the book image -->
            <div class="book-info">
                <h3>{{ book.title }}</h3>
                <p>by {{ book.author }}</p>
                <p>{{ book.description|truncatewords:20 }}</p> <!-- Display first 20 words of description -->
            </div>
            <div class="book-actions">
                <a href="{% url 'book_details' book.id %}">View Details</a> <!-- View Details button -->
            </div>
        </div>
    {% endfor %}
</div>

<div class="create-book">
    <a href="{% url 'create_book' %}">Create New Book</a>
</div>

</body>
</html>
