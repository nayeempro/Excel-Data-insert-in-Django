<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ action }} Book</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            padding: 20px;
            color: #4CAF50;
        }

        .form-container {
            width: 50%;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            border: 2px solid #ddd;  /* Border around the form */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-top: 50px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 16px;
            color: #333;
        }

        input[type="text"], textarea, input[type="file"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        textarea {
            height: 150px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #45a049;
        }

        .form-container input[type="file"] {
            padding: 5px;
        }
    </style>
</head>
<body>

<h1>{{ action }} Book</h1>

<div class="form-container">
    <form method="post" enctype="multipart/form-data"> <!-- enctype attribute is necessary for file upload -->
        {% csrf_token %}
        
        <label for="title">Title:</label>
        <input type="text" name="title" id="title" value="{{ book.title|default:'' }}" required><br>

        <label for="author">Author:</label>
        <input type="text" name="author" id="author" value="{{ book.author|default:'' }}" required><br>

        <label for="description">Description:</label>
        <textarea name="description" id="description" required>{{ book.description|default:'' }}</textarea><br>

        <label for="pic">Book Picture:</label>
        <input type="file" name="pic" id="pic"><br>  <!-- File input for the image -->

        <button type="submit">{{ action }} Book</button>
    </form>
</div>

</body>
</html>
