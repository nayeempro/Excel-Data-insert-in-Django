{% extends 'base.html' %}
{% block title %}Data Table{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 flex flex-col items-center py-10">
  <div class="w-full max-w-5xl bg-white shadow-2xl rounded-2xl p-8">
    <!-- 🏷️ Header -->
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Customer Information</h2>

    <!-- 📊 Table -->
    <div class="overflow-x-auto">
      <table class="min-w-full border border-gray-200 rounded-lg overflow-hidden">
        <thead class="bg-gray-800 text-white">
          <tr>
            <th class="px-4 py-2 text-left">StudentName</th>
            <th class="px-4 py-2 text-left">CourseName</th>
            <th class="px-4 py-2 text-left">Email</th>
            <th class="px-4 py-2 text-left">Price</th>
            <!-- 'StudentName', 'CourseName', 'Email', 'Price' -->
          </tr>
        </thead>
        <tbody>
          {% for d in data %}
            <tr>
              <th class="px-4 py-2 text-left">{{ d.StudentName }}</th>
              <th class="px-4 py-2 text-left">{{ d.CourseName }}</th>
              <th class="px-4 py-2 text-left">{{ d.Email }}</th>
              <th class="px-4 py-2 text-left">{{ d.Price }}</th>
            </tr>
          {% empty %}
          <tr>
            <td colspan="6" class="text-center text-gray-500 py-4">
              No data found 😢
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
